# Custom providers for omp (~/.omp/agent/models.yml, chezmoi-managed)
# apiKey is stored as an ENV VAR NAME (EVOMAP_API_KEY), never plaintext.
# Set EVOMAP_API_KEY=sk-evomap-... in your shell profile on every machine.
providers:
  evomap:
    baseUrl: https://api.evomap.ai/v1
    apiKey: EVOMAP_API_KEY
    api: openai-completions
    models:
      - id: evomap-kimi-k2.6
        name: Kimi K2.6 (EvoMap)
        api: openai-completions
        reasoning: true
        input: [text, image]
        cost:
          input: 8
          output: 35
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 262144
        maxTokens: 262144
