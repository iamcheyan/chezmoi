# Custom providers for omp (~/.omp/agent/models.yml, chezmoi-managed)
# API keys are stored as ENV VAR NAMES, resolved from ~/.omp/agent/.env (0600, NOT chezmoi-managed).
# Set values in .env on every machine; never commit plaintext keys.
providers:
  # DeepSeek direct (opencode.json "DS" provider)
  deepseek:
    baseUrl: https://api.deepseek.com
    apiKey: DEEPSEEK_API_KEY
    api: openai-completions
    models:
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash (DS)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 1
          output: 2
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro (DS)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 8192

  # EvoMap gateway
  evomap:
    baseUrl: https://api.evomap.ai/v1
    apiKey: EVOMAP_API_KEY
    api: openai-completions
    models:
      - id: evomap-deepseek-v4-flash
        name: DeepSeek V4 Flash (EvoMap)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 1
          output: 2
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 8192
      - id: evomap-kimi-k2.6
        name: Kimi K2.6 (EvoMap)
        api: openai-completions
        reasoning: true
        input: [text, image]
        cost:
          input: 8
          output: 35
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 262144
        maxTokens: 262144

  # OpenCode Go gateway
  opencode-go:
    baseUrl: https://opencode.ai/zen/go/v1
    apiKey: OPENCODE_GO_API_KEY
    api: openai-completions
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro (Go)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 8192
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash (Go)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 128000
        maxTokens: 8192

  # Ollama cloud (opencode.json "ollama" provider, https://ollama.com/v1)
  ollama:
    baseUrl: https://ollama.com/v1
    apiKey: OLLAMA_API_KEY
    api: openai-completions
    models:
      - id: glm-5.2
        name: GLM 5.2 (Ollama)
        api: openai-completions
        reasoning: false
        input: [text]
        cost:
          input: 8
          output: 31
          cacheRead: 0
          cacheWrite: 0
        contextWindow: 1000000
        maxTokens: 8192
